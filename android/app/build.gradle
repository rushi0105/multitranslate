plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace 'com.multitranslate.app'
    compileSdk 35
    defaultConfig {
        applicationId "com.multitranslate.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main { kotlin.srcDirs += 'src/main/kotlin' } }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output -> output.outputFileName = "MultiTranslate_${variant.versionName}.apk" }
    }
}

dependencies {
    // No AndroidX: a plain WebView shell keeps the APK tiny and the build offline-friendly.
}
